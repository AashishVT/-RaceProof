services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-raceproof}
      POSTGRES_USER: ${DB_USER:-raceproof}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD using --env-file backend/.env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - raceproof_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  raceproof_postgres_data:
